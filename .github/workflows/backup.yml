name: Database Backup

# Weekly logical backup of the Supabase database (roles + schema + data).
# Restores rely on the three dumps produced here; see docs/DATABASE.md.
#
# REQUIRED repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL — full Postgres connection string from
#     Supabase Dashboard → Project Settings → Database → Connection string
#     (URI, session pooler is fine).
#
# SAFETY: this workflow REFUSES to run on public repositories — workflow
# artifacts on public repos are downloadable, and the dump contains
# student personal data. Make the repo private first.

on:
  schedule:
    - cron: '30 18 * * 0' # Sundays 18:30 UTC = Mondays 02:30 PHT
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to run on public repos (dump contains student data)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRIVATE=$(gh api "repos/${{ github.repository }}" --jq '.private')
          if [ "$PRIVATE" != "true" ]; then
            echo "::error::This repo is PUBLIC — database backup artifacts would expose student personal data. Make the repo private (Settings → General → Danger Zone) before enabling backups."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Dump roles, schema, and data
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase db dump --db-url "$SUPABASE_DB_URL" --role-only -f roles.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" --data-only -f data.sql

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_id }}
          path: |
            roles.sql
            schema.sql
            data.sql
          retention-days: 90
